[project]
name = "petflow-ai-backend"
version = "0.1.0"
description = "API do PetFlow AI - SaaS multi-tenant para o mercado pet"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.4",
    "drf-spectacular>=0.28",
    "django-cors-headers>=4.7",
    "django-filter>=24.3",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "celery>=5.4",
    "django-celery-results>=2.5",
    "django-celery-beat>=2.7",
    "python-dotenv>=1.0",
    "django-environ>=0.11",
    "gunicorn>=23.0",
    "whitenoise>=6.8",
    "pillow>=11.0",
    "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "faker>=33.0",
    "ruff>=0.8",
    "coverage>=7.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
